name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.2"
      - name: Instantiate committed environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Check manifest preservation
        run: git diff --exit-code -- Manifest.toml
      - name: Run tests
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test(; allow_reresolve=false)'
      - name: Check manifest preservation after tests
        run: git diff --exit-code -- Manifest.toml
